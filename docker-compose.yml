version: '3.9'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - 5432:5432

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/taskdb
      DB_SSL: 'false'
      JWT_SECRET: replace_this_with_a_long_random_secret
      JWT_EXPIRES_IN: 7d
      CLIENT_ORIGIN: http://localhost:3000
    depends_on:
      - db
    ports:
      - 5000:5000
    volumes:
      - ./backend/data:/usr/src/app/data
    environment:
      NODE_ENV: production

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    restart: unless-stopped
    ports:
      - 3000:80

volumes:
  db-data:
